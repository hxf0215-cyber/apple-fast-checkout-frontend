[package]
name = "apple-fast-checkout"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "socks", "cookies", "gzip", "brotli", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
urlencoding = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chacha20poly1305 = "0.10"
rand = "0.8"
anyhow = "1"
tower-http = { version = "0.5", features = ["fs", "cors"] }
# 用于捕获后台任务的 panic（单层 spawn + catch_unwind，保证 abort 有效）
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
# 注意：不能设 panic="abort" —— 常驻任务依赖 unwind 才能被捕获并写日志
# 剥离符号表，exe 体积可显著减小
strip = true
lto = true
codegen-units = 1
opt-level = 3




